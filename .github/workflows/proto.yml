name: Protobuf CI

on:
  push:
    branches:
      - main
    paths:
      - 'proto/**'
      - '.github/workflows/proto.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'proto/**'
      - '.github/workflows/proto.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buf-ci:
    name: Lint & Breaking Change Check (Buf)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Protobuf files
        uses: bufbuild/buf-action@v1
        with:
          input: 'proto'
          lint: true
          # Disable formatting check temporarily during initial active development.
          format: false
          # Disable breaking change checks during initial active development; re-enable when moving to production.
          breaking: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_comment: false
