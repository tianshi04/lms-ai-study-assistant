[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "connectrpc>=0.11.1",
    "connectrpc-otel>=0.2.0",
    "cryptography>=49.0.0",
    "google-auth>=2.56.3",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-starlette>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "starlette>=1.3.1",
    "uuid6>=2025.0.1",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.71",
    "watchfiles>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[tool.ruff.lint]
extend-select = [
    "N",     # pep8-naming
    "C4",    # flake8-comprehensions
    "LOG",   # flake8-logging
    "FURB",  # refurb (code modernization)
    "RET",   # flake8-return (return consistency)
    "PERF",  # perflint (performance optimizations)
    "PT",    # flake8-pytest-style (pytest standards)
    "SLF",   # flake8-self (private member access)
    "A",     # flake8-builtins (built-in shadowing protection)
    "ARG",   # flake8-unused-arguments (unused argument elimination)
    "TID",   # flake8-tidy-imports (clean import structure & banned APIs)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy".msg = "Domain/Application layers must remain pure & independent of SQLAlchemy ORM. Use Repository interfaces."
"connectrpc".msg = "Domain layer cannot depend on ConnectRPC transport."
"starlette".msg = "Domain layer cannot depend on Starlette web framework."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "ARG001", "ARG002", "ARG005", "TID251"]
"src/modules/*/presentation/**" = ["ARG002", "TID251"]
"src/modules/*/infrastructure/**" = ["TID251"]
"src/shared/infrastructure/**" = ["TID251"]
"src/shared/auth_policy.py" = ["TID251"]
"src/shared/auth.py" = ["TID251"]
"src/shared/permissions.py" = ["TID251"]
"src/shared/access_policy.py" = ["TID251"]
"alembic/**" = ["TID251"]
"src/main.py" = ["TID251"]
"src/seed.py" = ["TID251"]
"src/scripts/**" = ["TID251"]
"src/modules/*/domain/**" = ["A002"]
"src/shared/domain/**" = ["A002"]


