services:
  # ------------------------------------------------------------------
  # 1. HẠ TẦNG CƠ SỞ DỮ LIỆU: PostgreSQL 16/17 + PGVector
  # ------------------------------------------------------------------
  postgres:
    profiles: ["infra", "app", "all"]
    image: pgvector/pgvector:pg17
    container_name: coursera_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coursera_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coursera_password123}
      POSTGRES_DB: ${POSTGRES_DB:-coursera_lms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coursera_admin} -d ${POSTGRES_DB:-coursera_lms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # 2. HẠ TẦNG LƯU TRỮ TỆP: MinIO (S3 Compatible Storage)
  # ------------------------------------------------------------------
  minio:
    profiles: ["infra", "app", "all"]
    image: cgr.dev/chainguard/minio:latest
    container_name: coursera_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password123}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # 3. DỊCH VỤ BACKEND API
  # ------------------------------------------------------------------
  backend:
    profiles: ["app", "all"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coursera_backend_api
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      - ENV=development
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-coursera_admin}:${POSTGRES_PASSWORD:-coursera_password123}@postgres:5432/${POSTGRES_DB:-coursera_lms}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minio_password123}
      - MINIO_BUCKET_NAME=coursera-assets
      - MINIO_SECURE=false
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_coursera_2026_change_in_prod}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5081
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-admin@coursera.local}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-openobserve_password123}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ------------------------------------------------------------------
  # 4. HẠ TẦNG IN-MEMORY CACHE & JOB QUEUE: Redis 7
  # ------------------------------------------------------------------
  redis:
    profiles: ["infra", "app", "all"]
    image: redis:7-alpine
    container_name: coursera_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # 5. HẠ TẦNG OBSERVABILITY: OpenObserve All-In-One (Logs, Metrics, Traces, RUM)
  # ------------------------------------------------------------------
  openobserve:
    profiles: ["infra", "app", "all"]
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: coursera_openobserve
    restart: always
    environment:
      - ZO_DATA_DIR=/data
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-admin@coursera.local}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-openobserve_password123}
    ports:
      - "${OPENOBSERVE_HTTP_PORT:-5080}:5080" # Web UI, HTTP API & Browser RUM Ingestion
      - "${OPENOBSERVE_GRPC_PORT:-5081}:5081" # OTLP gRPC Receiver (Traces & Metrics)
    volumes:
      - openobserve_data:/data


volumes:
  postgres_data:
  minio_data:
  redis_data:
  openobserve_data:
