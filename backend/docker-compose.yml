services:
  # ------------------------------------------------------------------
  # 1. HẠ TẦNG CƠ SỞ DỮ LIỆU: PostgreSQL 16/17 + PGVector
  # ------------------------------------------------------------------
  postgres:
    profiles: ["infra", "app", "all"]
    image: pgvector/pgvector:pg17
    container_name: coursera_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coursera_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coursera_password123}
      POSTGRES_DB: ${POSTGRES_DB:-coursera_lms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coursera_admin} -d ${POSTGRES_DB:-coursera_lms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # 2. HẠ TẦNG LƯU TRỮ TỆP: MinIO (S3 Compatible Storage)
  # ------------------------------------------------------------------
  minio:
    profiles: ["infra", "app", "all"]
    image: minio/minio:latest
    container_name: coursera_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password123}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9090}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # 3. DỊCH VỤ BACKEND API
  # ------------------------------------------------------------------
  backend:
    profiles: ["app", "all"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coursera_backend_api
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      - ENV=development
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-coursera_admin}:${POSTGRES_PASSWORD:-coursera_password123}@postgres:5432/${POSTGRES_DB:-coursera_lms}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:8000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minio_password123}
      - MINIO_BUCKET_NAME=coursera-assets
      - MINIO_SECURE=false
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_coursera_2026_change_in_prod}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ------------------------------------------------------------------
  # 4. HẠ TẦNG OBSERVABILITY: Jaeger All-In-One (OTel Collector & UI)
  # ------------------------------------------------------------------
  jaeger:
    profiles: ["infra", "app", "all"]
    image: jaegertracing/all-in-one:latest
    container_name: coursera_jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "16686:16686" # Jaeger Web UI


volumes:
  postgres_data:
  minio_data:
