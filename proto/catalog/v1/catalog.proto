syntax = "proto3";

package catalog.v1;

import "auth/v1/options.proto";

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_VIDEO = 1;
  ITEM_TYPE_READING = 2;
  ITEM_TYPE_PRACTICE_QUIZ = 3;
  ITEM_TYPE_GRADED_QUIZ = 4;
  ITEM_TYPE_AUTO_GRADED_LAB = 5;
  ITEM_TYPE_PEER_REVIEW = 6;
}


message InteractiveTranscript {
  int32 timestamp_seconds = 1;
  string text = 2;
}

message InVideoQuiz {
  int32 timestamp_seconds = 1;
  string question = 2;
  repeated string options = 3;
  int32 correct_option_index = 4;
  string explanation = 5;
}

message LearningItem {
  string id = 1;
  string title = 2;
  ItemType type = 3;
  int32 estimated_minutes = 4;
  string video_url = 5;
  string vtt_subtitle_url = 6;
  repeated InteractiveTranscript interactive_transcripts = 7;
  repeated InVideoQuiz in_video_quizzes = 8;
  string reading_markdown = 9;
  int32 order_index = 10;
  string starter_code = 11;
  string test_cases_json = 12;
  string language = 13;
  string rubric_criteria_json = 14;
  string quiz_matrix_id = 15;
  string scorm_package_path = 16;
  string scorm_entry_html = 17;
  bool auto_transcribe = 18;
  bool prohibit_seeking = 19;
}

message Lesson {
  string id = 1;
  string title = 2;
  int32 estimated_minutes = 3;
  repeated LearningItem items = 4;
  int32 order_index = 5;
}

message WeekModule {
  string id = 1;
  int32 week_number = 2;
  string title = 3;
  string summary = 4;
  repeated Lesson lessons = 5;
}

// Course messages
message Course {
  string id = 1;
  string title = 2;
  string slug = 3;
  string description = 4;
  string partner_name = 5;
  string partner_logo_url = 6;
  repeated string instructor_names = 7;
  repeated WeekModule week_modules = 8;
  double average_rating = 9;
  int32 review_count = 10;
  
  // Tags
  string subject = 11;
  string level = 12;
}

// Specialization messages
message Specialization {
  string id = 1;
  string title = 2;
  string slug = 3;
  string description = 4;
  string partner_name = 5;
  string partner_logo_url = 6;
  repeated Course courses = 7;
}

message GetSpecializationRequest {
  string id_or_slug = 1;
}

message GetSpecializationResponse {
  Specialization specialization = 1;
}

// Catalog queries
message ListCoursesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string search_query = 3;
  string subject = 4;
  string level = 5;
  string sort_by = 6;
}

message ListCoursesResponse {
  repeated Course courses = 1;
  string next_page_token = 2;
}

message GetCourseDetailRequest {
  string id_or_slug = 1;
}

message GetCourseDetailResponse {
  Course course = 1;
}

message GetLessonDetailRequest {
  string lesson_id = 1;
}

message GetLessonDetailResponse {
  Lesson lesson = 1;
}

// Management messages (Instructors/Partners)
message CreateCourseRequest {
  string title = 1;
  string slug = 2;
  string description = 3;
  string partner_name = 4;
  string partner_logo_url = 5;
  repeated string instructor_names = 6;
  string subject = 7;
  string level = 8;
}

message CreateCourseResponse {
  Course course = 1;
}

message UpdateCourseRequest {
  string id = 1;
  string title = 2;
  string slug = 3;
  string description = 4;
  string partner_name = 5;
  string partner_logo_url = 6;
  repeated string instructor_names = 7;
  string subject = 8;
  string level = 9;
}

message UpdateCourseResponse {
  Course course = 1;
}

message DeleteCourseRequest {
  string id = 1;
}

message DeleteCourseResponse {
  bool success = 1;
}

message CreateWeekModuleRequest {
  string course_id = 1;
  int32 week_number = 2;
  string title = 3;
  string summary = 4;
}

message CreateWeekModuleResponse {
  WeekModule week_module = 1;
}

message UpdateWeekModuleRequest {
  string id = 1;
  string course_id = 2;
  int32 week_number = 3;
  string title = 4;
  string summary = 5;
}

message UpdateWeekModuleResponse {
  WeekModule week_module = 1;
}

message DeleteWeekModuleRequest {
  string id = 1;
  string course_id = 2;
}

message DeleteWeekModuleResponse {
  bool success = 1;
}

message CreateLessonRequest {
  string course_id = 1;
  string week_module_id = 2;
  string title = 3;
  int32 estimated_minutes = 4;
}

message CreateLessonResponse {
  Lesson lesson = 1;
}

message UpdateLessonRequest {
  string id = 1;
  string course_id = 2;
  string week_module_id = 3;
  string title = 4;
  int32 estimated_minutes = 5;
}

message UpdateLessonResponse {
  Lesson lesson = 1;
}

message DeleteLessonRequest {
  string id = 1;
  string course_id = 2;
}

message DeleteLessonResponse {
  bool success = 1;
}

message CreateLearningItemRequest {
  string course_id = 1;
  string lesson_id = 2;
  string title = 3;
  ItemType type = 4;
  int32 estimated_minutes = 5;
  
  // Specific fields based on type
  string video_url = 6;
  string reading_markdown = 7;
  repeated InVideoQuiz in_video_quizzes = 8;
  string starter_code = 9;
  string test_cases_json = 10;
  string language = 11;
  string rubric_criteria_json = 12;
  string quiz_matrix_id = 13;
  string scorm_package_path = 14;
  string scorm_entry_html = 15;
  string vtt_subtitle_url = 16;
  bool auto_transcribe = 17;
  bool prohibit_seeking = 18;
}

message CreateLearningItemResponse {
  LearningItem item = 1;
}

// Review Messages
message UpdateLearningItemRequest {
  string id = 1;
  string course_id = 2;
  string lesson_id = 3;
  string title = 4;
  ItemType type = 5;
  int32 estimated_minutes = 6;
  string video_url = 7;
  string reading_markdown = 8;
  repeated InVideoQuiz in_video_quizzes = 9;
  string starter_code = 10;
  string test_cases_json = 11;
  string language = 12;
  string rubric_criteria_json = 13;
  string quiz_matrix_id = 14;
  string scorm_package_path = 15;
  string scorm_entry_html = 16;
  string vtt_subtitle_url = 17;
  bool auto_transcribe = 18;
  bool prohibit_seeking = 19;
}

message UpdateLearningItemResponse {
  LearningItem item = 1;
}

message DeleteLearningItemRequest {
  string id = 1;
  string course_id = 2;
}

message DeleteLearningItemResponse {
  bool success = 1;
}

message CourseReview {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string course_id = 4;
  int32 rating_stars = 5;
  string comment_text = 6;
  string created_at = 7;
  bool is_verified_completer = 8;
}

message SubmitCourseReviewRequest {
  string course_id = 1;
  int32 rating_stars = 2;
  string comment_text = 3;
}

message SubmitCourseReviewResponse {
  CourseReview review = 1;
}

message ListCourseReviewsRequest {
  string course_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListCourseReviewsResponse {
  repeated CourseReview reviews = 1;
  double average_rating = 2;
  int32 total_reviews = 3;
  string next_page_token = 4;
}

// Admin Category Messages
message Category {
  string id = 1;
  string name = 2;
  string slug = 3;
  string type = 4; // "SUBJECT" or "LEVEL"
}

message ListCategoriesRequest {
  string type = 1; // Optional filter by type
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

message CreateCategoryRequest {
  string name = 1;
  string type = 2; // "SUBJECT" or "LEVEL"
}

message CreateCategoryResponse {
  Category category = 1;
}

message DeleteCategoryRequest {
  string id = 1;
}

message DeleteCategoryResponse {
  bool success = 1;
}


message CourseAnnouncement {
  string id = 1;
  string course_id = 2;
  string author_id = 3;
  string author_name = 4;
  string title = 5;
  string content = 6;
  string created_at = 7;
}

message CreateCourseAnnouncementRequest {
  string course_id = 1;
  string title = 2;
  string content = 3;
}

message CreateCourseAnnouncementResponse {
  CourseAnnouncement announcement = 1;
}

message ListCourseAnnouncementsRequest {
  string course_id = 1;
}

message ListCourseAnnouncementsResponse {
  repeated CourseAnnouncement announcements = 1;
}

message EnrolledStudent {
  string user_id = 1;
  string user_name = 2;
  string user_email = 3;
  float progress_percent = 4;
  string enrolled_at = 5;
}

message InstructorAnalytics {
  string course_id = 1;
  int32 total_enrolled_students = 2;
  float average_completion_rate = 3;
  double average_rating = 4;
  int32 review_count = 5;
  repeated EnrolledStudent students = 6;
}

message GetInstructorAnalyticsRequest {
  string course_id = 1;
}

message GetInstructorAnalyticsResponse {
  InstructorAnalytics analytics = 1;
}

message ReorderWeekModulesRequest {
  string course_id = 1;
  repeated string ordered_week_module_ids = 2;
}

message ReorderWeekModulesResponse {
  bool success = 1;
}

message ReorderLessonsRequest {
  string course_id = 1;
  string week_module_id = 2;
  repeated string ordered_lesson_ids = 3;
}

message ReorderLessonsResponse {
  bool success = 1;
}

message ReorderLearningItemsRequest {
  string course_id = 1;
  string lesson_id = 2;
  repeated string ordered_item_ids = 3;
}

message ReorderLearningItemsResponse {
  bool success = 1;
}

service CatalogService {
  rpc GetSpecialization(GetSpecializationRequest) returns (GetSpecializationResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc ListCourses(ListCoursesRequest) returns (ListCoursesResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc GetCourseDetail(GetCourseDetailRequest) returns (GetCourseDetailResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc GetLessonDetail(GetLessonDetailRequest) returns (GetLessonDetailResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc CreateCourse(CreateCourseRequest) returns (CreateCourseResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UpdateCourse(UpdateCourseRequest) returns (UpdateCourseResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeleteCourse(DeleteCourseRequest) returns (DeleteCourseResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc CreateWeekModule(CreateWeekModuleRequest) returns (CreateWeekModuleResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UpdateWeekModule(UpdateWeekModuleRequest) returns (UpdateWeekModuleResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeleteWeekModule(DeleteWeekModuleRequest) returns (DeleteWeekModuleResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc CreateLesson(CreateLessonRequest) returns (CreateLessonResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UpdateLesson(UpdateLessonRequest) returns (UpdateLessonResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeleteLesson(DeleteLessonRequest) returns (DeleteLessonResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc CreateLearningItem(CreateLearningItemRequest) returns (CreateLearningItemResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UpdateLearningItem(UpdateLearningItemRequest) returns (UpdateLearningItemResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeleteLearningItem(DeleteLearningItemRequest) returns (DeleteLearningItemResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ReorderWeekModules(ReorderWeekModulesRequest) returns (ReorderWeekModulesResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ReorderLessons(ReorderLessonsRequest) returns (ReorderLessonsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ReorderLearningItems(ReorderLearningItemsRequest) returns (ReorderLearningItemsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitCourseReview(SubmitCourseReviewRequest) returns (SubmitCourseReviewResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListCourseReviews(ListCourseReviewsRequest) returns (ListCourseReviewsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc CreateCourseAnnouncement(CreateCourseAnnouncementRequest) returns (CreateCourseAnnouncementResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListCourseAnnouncements(ListCourseAnnouncementsRequest) returns (ListCourseAnnouncementsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc GetInstructorAnalytics(GetInstructorAnalyticsRequest) returns (GetInstructorAnalyticsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  
  // Category Admin endpoints
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ParseScormPackage(ParseScormPackageRequest) returns (ParseScormPackageResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ImportCourseFromScorm(ImportCourseFromScormRequest) returns (ImportCourseFromScormResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ExportCourseToScorm(ExportCourseToScormRequest) returns (ExportCourseToScormResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GenerateUploadUrl(GenerateUploadUrlRequest) returns (GenerateUploadUrlResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UploadMediaFile(UploadMediaFileRequest) returns (UploadMediaFileResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
}

message ParseScormPackageRequest {
  string scorm_object_key = 1;
  string target_course_id = 2;
}

message ParseScormPackageResponse {
  Course course_preview = 1;
  bool is_single_item = 2;
  LearningItem single_item_preview = 3;
}

message ImportCourseFromScormRequest {
  string scorm_object_key = 1;
  string course_id = 2;
  string target_lesson_id = 3;
}

message ImportCourseFromScormResponse {
  Course course = 1;
  LearningItem imported_item = 2;
}

message ExportCourseToScormRequest {
  string course_id = 1;
}

message ExportCourseToScormResponse {
  string download_url = 1;
  string object_key = 2;
}

message GenerateUploadUrlRequest {
  string filename = 1;
  string content_type = 2;
  string folder = 3;
}

message GenerateUploadUrlResponse {
  string upload_url = 1;
  string file_url = 2;
  string object_key = 3;
}

message UploadMediaFileRequest {
  string filename = 1;
  string content_type = 2;
  bytes file_bytes = 3;
  string folder = 4;
}

message UploadMediaFileResponse {
  string file_url = 1;
  string object_key = 2;
}


