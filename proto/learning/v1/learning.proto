syntax = "proto3";

package learning.v1;

import "auth/v1/options.proto";

enum DeadlineStatus {
  DEADLINE_STATUS_UNSPECIFIED = 0;
  DEADLINE_STATUS_ON_TRACK = 1;
  DEADLINE_STATUS_OVERDUE = 2;
  DEADLINE_STATUS_COMPLETED = 3;
}

message WeeklyDeadline {
  int32 week_number = 1;
  string due_date = 2;
  DeadlineStatus status = 3;
}

message LearningProgress {
  string user_id = 1;
  string course_id = 2;
  float overall_progress_percent = 3;
  repeated string completed_item_ids = 4;
  repeated WeeklyDeadline weekly_deadlines = 5;
  string last_accessed_at = 6;
  string last_accessed_item_id = 7;
  string enrolled_at = 8;
  string completed_at = 9;
}

message PersonalNote {
  string id = 1;
  string user_id = 2;
  string course_id = 3;
  string item_id = 4;
  string highlighted_text = 5;
  string note_comment = 6;
  string created_at = 7;
  int32 timestamp_seconds = 8;
  string updated_at = 9;
}

message GetProgressRequest {
  string course_id = 1;
  optional string current_item_id = 2;
}

message GetProgressResponse {
  LearningProgress progress = 1;
}

message ResetDeadlinesRequest {
  string course_id = 1;
}

message ResetDeadlinesResponse {
  bool success = 1;
  LearningProgress updated_progress = 2;
}

message SavePersonalNoteRequest {
  string course_id = 1;
  string item_id = 2;
  string highlighted_text = 3;
  string note_comment = 4;
  int32 timestamp_seconds = 5;
}

message SavePersonalNoteResponse {
  PersonalNote note = 1;
}

message ListPersonalNotesRequest {
  string course_id = 1;
}

message ListPersonalNotesResponse {
  repeated PersonalNote notes = 1;
}

message DeletePersonalNoteRequest {
  string note_id = 1;
}

message DeletePersonalNoteResponse {
  bool success = 1;
}

message MarkItemCompleteRequest {
  string course_id = 1;
  string item_id = 2;
}

message MarkItemCompleteResponse {
  bool success = 1;
  LearningProgress updated_progress = 2;
}

message ListMyEnrolledCoursesRequest {}

message EnrolledCourseSummary {
  string course_id = 1;
  string course_title = 2;
  string partner_name = 3;
  float progress_percent = 4;
  string status = 5; // "NOT_STARTED" | "IN_PROGRESS" | "COMPLETED"
  string last_accessed_at = 6;
  string last_accessed_item_id = 7;
  string enrolled_at = 8;
  string completed_at = 9;
}

message ListMyEnrolledCoursesResponse {
  repeated EnrolledCourseSummary courses = 1;
}

message RecordLearningTimeRequest {
  string course_id = 1;
  string item_id = 2;
  int32 delta_seconds = 3;
  string client_timezone = 4;
}

message RecordLearningTimeResponse {
  int32 item_total_seconds = 1;
  int32 today_total_seconds = 2;
  int32 current_streak = 3;
  bool is_streak_extended_today = 4;
}

message DailyStudyRecord {
  string date = 1;
  int32 total_seconds = 2;
  bool is_streak_qualified = 3;
}

message GetLearningStreakRequest {
  string client_timezone = 1;
}

message GetLearningStreakResponse {
  int32 current_streak = 1;
  int32 longest_streak = 2;
  int32 today_study_seconds = 3;
  int32 total_study_seconds = 4;
  string last_active_date = 5;
  repeated DailyStudyRecord recent_days = 6;
}

service LearningService {
  rpc GetProgress(GetProgressRequest) returns (GetProgressResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ResetDeadlines(ResetDeadlinesRequest) returns (ResetDeadlinesResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SavePersonalNote(SavePersonalNoteRequest) returns (SavePersonalNoteResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListPersonalNotes(ListPersonalNotesRequest) returns (ListPersonalNotesResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeletePersonalNote(DeletePersonalNoteRequest) returns (DeletePersonalNoteResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc MarkItemComplete(MarkItemCompleteRequest) returns (MarkItemCompleteResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListMyEnrolledCourses(ListMyEnrolledCoursesRequest) returns (ListMyEnrolledCoursesResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc RecordLearningTime(RecordLearningTimeRequest) returns (RecordLearningTimeResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetLearningStreak(GetLearningStreakRequest) returns (GetLearningStreakResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetAdminLearningStats(GetAdminLearningStatsRequest) returns (GetAdminLearningStatsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetAdminLearningTrend(GetAdminLearningTrendRequest) returns (GetAdminLearningTrendResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
}

message GetAdminLearningStatsRequest {}

message GetAdminLearningStatsResponse {
  int32 total_enrollments = 1;
  int32 completed_enrollments = 2;
}

message GetAdminLearningTrendRequest {
  // Number of trailing UTC days (including today) to chart; clamped server-side.
  int32 days = 1;
}

message AdminLearningTrendPoint {
  // UTC calendar day formatted as YYYY-MM-DD.
  string date = 1;
  int32 enrollments = 2;
  int32 completions = 3;
}

message GetAdminLearningTrendResponse {
  repeated AdminLearningTrendPoint points = 1;
}
