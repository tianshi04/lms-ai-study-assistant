syntax = "proto3";

package assessment.v1;

import "auth/v1/options.proto";

message SubmitHonorCodeRequest {
  string item_id = 1;
  bool is_agreed = 2;
}

message SubmitHonorCodeResponse {
  bool success = 1;
  string message = 2;
}

message QuizQuestionAnswer {
  repeated int32 selected_option_indexes = 1;
}

message SubmitGradedQuizRequest {
  string item_id = 1;
  int32 session_seed = 3;
  string start_time_iso = 4;
  bool preview = 5;
  repeated QuizQuestionAnswer question_answers = 6;
}

message QuizResult {
  float score_percent = 1;
  bool passed = 2;
  int32 attempts_left = 3;
  int32 cooldown_seconds_left = 4;
  repeated string answer_explanations = 5;
  int32 max_attempts = 6;
  int32 cooldown_hours = 7;
}

message SubmitGradedQuizResponse {
  QuizResult result = 1;
}

message SubmitAutoGradedLabRequest {
  string item_id = 1;
  string source_code = 2;
  string language = 3;
}

message AutoGradedLabResult {
  float score_percent = 1;
  bool passed = 2;
  int32 total_test_cases = 3;
  int32 passed_test_cases = 4;
  string test_logs = 5;
}

message SubmitAutoGradedLabResponse {
  AutoGradedLabResult result = 1;
}

message SubmitPeerAssignmentRequest {
  string item_id = 1;
  string submission_url = 2;
  string text_content = 3;
}

message SubmitPeerAssignmentResponse {
  string submission_id = 1;
  string status_message = 2;
}

message GetPeerReviewsToGradeRequest {
  string item_id = 1;
}

message RubricCriteria {
  string criteria_id = 1;
  string title = 2;
  float max_score = 3;
  float score_given = 4;
  string feedback = 5;
}

message PeerReviewItemToGrade {
  string review_id = 1;
  string submission_url = 2;
  string text_content = 3;
  repeated RubricCriteria rubric_criteria = 4;
}

message GetPeerReviewsToGradeResponse {
  repeated PeerReviewItemToGrade items_to_grade = 1;
}

message SubmitPeerReviewGradeRequest {
  string review_id = 1;
  repeated RubricCriteria graded_criteria = 2;
}

message SubmitPeerReviewGradeResponse {
  bool success = 1;
  string message = 2;
}

message SubmitGradeAppealRequest {
  string submission_id = 1;
  string appeal_reason = 2;
}

message SubmitGradeAppealResponse {
  bool success = 1;
  string appeal_status = 2;
}

message ReportPeerReviewRequest {
  string review_id = 1;
  string report_reason = 2;
}

message ReportPeerReviewResponse {
  bool success = 1;
  string message = 2;
}

message RegradePeerSubmissionByStaffRequest {
  string submission_id = 1;
  float ta_score = 2;
}

message RegradePeerSubmissionByStaffResponse {
  bool success = 1;
  string message = 2;
}

message QuestionOption {
  string id = 1;
  string question_id = 2;
  string option_text = 3;
  bool is_correct = 4;
  int32 order_index = 5;
}

message Question {
  string id = 1;
  string bank_id = 2;
  string question_type = 3; // 'SINGLE_CHOICE', 'MULTIPLE_CHOICE', 'TRUE_FALSE', 'FILL_IN_BLANK'
  string difficulty = 4; // 'EASY', 'MEDIUM', 'HARD'
  string text = 5;
  string explanation = 6;
  repeated QuestionOption options = 7;
  string created_at = 8;
  string topic = 9;
}

message QuestionBank {
  string id = 1;
  string course_id = 2;
  string title = 3;
  string category = 4; // 'PRACTICE', 'MODULE_EXAM', 'FINAL_EXAM'
  string description = 5;
  repeated Question questions = 6;
  string created_at = 7;
}

message QuizMatrix {
  string item_id = 1;
  string bank_id = 2;
  int32 time_limit_minutes = 3;
  float passing_threshold_percent = 4;
  int32 easy_count = 5;
  int32 medium_count = 6;
  int32 hard_count = 7;
  bool shuffle_options = 8;
  int32 max_attempts = 9;
  int32 cooldown_hours = 10;
}

message CreateQuestionBankRequest {
  string course_id = 1;
  string title = 2;
  string category = 3;
  string description = 4;
}

message CreateQuestionBankResponse {
  QuestionBank bank = 1;
}

message ListQuestionBanksRequest {
  string course_id = 1;
}

message ListQuestionBanksResponse {
  repeated QuestionBank banks = 1;
}

message AddQuestionToBankRequest {
  string bank_id = 1;
  string question_type = 2;
  string difficulty = 3;
  string text = 4;
  string explanation = 5;
  repeated QuestionOption options = 6;
  string topic = 7;
}

message AddQuestionToBankResponse {
  Question question = 1;
}

message ConfigureQuizMatrixRequest {
  string item_id = 1;
  string bank_id = 2;
  int32 time_limit_minutes = 3;
  float passing_threshold_percent = 4;
  int32 easy_count = 5;
  int32 medium_count = 6;
  int32 hard_count = 7;
  bool shuffle_options = 8;
  int32 max_attempts = 9;
  int32 cooldown_hours = 10;
}

message ConfigureQuizMatrixResponse {
  QuizMatrix matrix = 1;
}

message GetQuizMatrixRequest {
  string item_id = 1;
}

message GetQuizMatrixResponse {
  QuizMatrix matrix = 1;
}

message UpdateQuestionRequest {
  string question_id = 1;
  string question_type = 2;
  string difficulty = 3;
  string text = 4;
  string explanation = 5;
  repeated QuestionOption options = 6;
  string topic = 7;
}

message UpdateQuestionResponse {
  Question question = 1;
}

message DeleteQuestionRequest {
  string question_id = 1;
}

message DeleteQuestionResponse {
  bool success = 1;
  string message = 2;
}

service AssessmentService {
  rpc SubmitHonorCode(SubmitHonorCodeRequest) returns (SubmitHonorCodeResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitGradedQuiz(SubmitGradedQuizRequest) returns (SubmitGradedQuizResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitAutoGradedLab(SubmitAutoGradedLabRequest) returns (SubmitAutoGradedLabResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitPeerAssignment(SubmitPeerAssignmentRequest) returns (SubmitPeerAssignmentResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetPeerReviewsToGrade(GetPeerReviewsToGradeRequest) returns (GetPeerReviewsToGradeResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitPeerReviewGrade(SubmitPeerReviewGradeRequest) returns (SubmitPeerReviewGradeResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitGradeAppeal(SubmitGradeAppealRequest) returns (SubmitGradeAppealResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ReportPeerReview(ReportPeerReviewRequest) returns (ReportPeerReviewResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc RegradePeerSubmissionByStaff(RegradePeerSubmissionByStaffRequest) returns (RegradePeerSubmissionByStaffResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc CreateQuestionBank(CreateQuestionBankRequest) returns (CreateQuestionBankResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListQuestionBanks(ListQuestionBanksRequest) returns (ListQuestionBanksResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc AddQuestionToBank(AddQuestionToBankRequest) returns (AddQuestionToBankResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ConfigureQuizMatrix(ConfigureQuizMatrixRequest) returns (ConfigureQuizMatrixResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetQuizMatrix(GetQuizMatrixRequest) returns (GetQuizMatrixResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UpdateQuestion(UpdateQuestionRequest) returns (UpdateQuestionResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeleteQuestion(DeleteQuestionRequest) returns (DeleteQuestionResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc StartGradedQuizSession(StartGradedQuizSessionRequest) returns (StartGradedQuizSessionResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetQuizAttemptHistory(GetQuizAttemptHistoryRequest) returns (GetQuizAttemptHistoryResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetQuizAttemptDetail(GetQuizAttemptDetailRequest) returns (GetQuizAttemptDetailResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListGradingQueue(ListGradingQueueRequest) returns (ListGradingQueueResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ClaimGradingTask(ClaimGradingTaskRequest) returns (ClaimGradingTaskResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc RenewGradingTaskLock(RenewGradingTaskLockRequest) returns (RenewGradingTaskLockResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ReleaseGradingTask(ReleaseGradingTaskRequest) returns (ReleaseGradingTaskResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetGradingSubmissionDetail(GetGradingSubmissionDetailRequest) returns (GetGradingSubmissionDetailResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitStaffGrading(SubmitStaffGradingRequest) returns (SubmitStaffGradingResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ReleaseCourseGrades(ReleaseCourseGradesRequest) returns (ReleaseCourseGradesResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
}

message StartGradedQuizSessionRequest {
  string item_id = 1;
  bool preview = 2;
  bool force_new = 3;
}

message QuizSessionQuestionOption {
  int32 option_index = 1;
  string option_text = 2;
}

message QuizSessionQuestion {
  string question_id = 1;
  string text = 2;
  repeated QuizSessionQuestionOption options = 3;
  string question_type = 4;
  string topic = 5;
}

message StartGradedQuizSessionResponse {
  string session_id = 1;
  int32 time_limit_minutes = 2;
  float passing_threshold_percent = 3;
  repeated QuizSessionQuestion questions = 4;
  string start_time_iso = 5;
  int32 session_seed = 6;
  int32 cooldown_seconds_left = 7;
  int32 attempts_left = 8;
  int32 max_attempts = 9;
  int32 cooldown_hours = 10;
  bool has_previous_result = 11;
  QuizResult previous_result = 12;
}

enum TopicMasteryLevel {
  TOPIC_MASTERY_LEVEL_UNSPECIFIED = 0;
  TOPIC_MASTERY_LEVEL_MASTERED = 1;
  TOPIC_MASTERY_LEVEL_NEEDS_PRACTICE = 2;
  TOPIC_MASTERY_LEVEL_WEAK_GAP = 3;
}

message QuizAttemptSummary {
  string submission_id = 1;
  int32 attempt_number = 2;
  float score_percent = 3;
  bool passed = 4;
  int32 total_questions = 5;
  int32 correct_count = 6;
  string submitted_at = 7;
}

message TopicMastery {
  string topic = 1;
  int32 total_questions = 2;
  int32 correct_questions = 3;
  float mastery_percent = 4;
  TopicMasteryLevel mastery_level = 5;
  string recommendation = 6;
}

message GetQuizAttemptHistoryRequest {
  string item_id = 1;
}

message GetQuizAttemptHistoryResponse {
  repeated QuizAttemptSummary attempts = 1;
  repeated TopicMastery aggregate_topic_mastery = 2;
  float highest_score_percent = 3;
  bool has_passed = 4;
  int32 attempts_left = 5;
  int32 max_attempts = 6;
  int32 cooldown_seconds_left = 7;
  float passing_threshold_percent = 8;
  int32 time_limit_minutes = 9;
}

message QuizAttemptAnswerDetail {
  string question_id = 1;
  string question_text = 2;
  string question_type = 3;
  string topic = 4;
  repeated string options = 5;
  repeated int32 selected_option_indices = 6;
  repeated int32 correct_option_indices = 7;
  bool is_correct = 8;
  string explanation = 9;
  int32 order_index = 10;
  bool is_answer_masked = 11;
}

message GetQuizAttemptDetailRequest {
  string submission_id = 1;
}

message GetQuizAttemptDetailResponse {
  string submission_id = 1;
  string item_id = 2;
  int32 attempt_number = 3;
  float score_percent = 4;
  bool passed = 5;
  string submitted_at = 6;
  repeated QuizAttemptAnswerDetail answers = 7;
  repeated TopicMastery topic_mastery = 8;
  bool is_answer_masked = 9;
}

enum GradingQueueStatus {
  GRADING_QUEUE_STATUS_UNSPECIFIED = 0;
  GRADING_QUEUE_STATUS_ALL = 1;
  GRADING_QUEUE_STATUS_PENDING = 2;
  GRADING_QUEUE_STATUS_CLAIMED = 3;
  GRADING_QUEUE_STATUS_APPEALED = 4;
  GRADING_QUEUE_STATUS_GRADED = 5;
}

enum GradingProvenance {
  GRADING_PROVENANCE_UNSPECIFIED = 0;
  GRADING_PROVENANCE_AUTO = 1;
  GRADING_PROVENANCE_PEER = 2;
  GRADING_PROVENANCE_TA = 3;
  GRADING_PROVENANCE_INSTRUCTOR = 4;
}

message GradingQueueItem {
  string submission_id = 1;
  string item_id = 2;
  string item_title = 3;
  string course_id = 4;
  string course_title = 5;
  string student_id = 6;
  string student_name = 7;
  string student_avatar_url = 8;
  string submitted_at = 9;
  bool is_outlier = 10;
  bool is_appeal = 11;
  string appeal_reason = 12;
  string locked_by_user_id = 13;
  string locked_by_name = 14;
  string lock_expires_at = 15;
  GradingProvenance grade_source = 16;
  float staff_score = 17;
  bool is_draft = 18;
  GradingQueueStatus status = 19;
  float peer_score = 20;
  int32 peer_reviews_count = 21;
}

message ListGradingQueueRequest {
  string course_id = 1;
  string item_id = 2;
  GradingQueueStatus status = 3;
  int32 page_size = 4;
  string page_token = 5;
  string search_query = 6;
}

message ListGradingQueueResponse {
  repeated GradingQueueItem items = 1;
  string next_page_token = 2;
  int32 total_count = 3;
  int32 pending_count = 4;
  int32 claimed_count = 5;
  int32 appealed_count = 6;
  int32 graded_count = 7;
}

message ClaimGradingTaskRequest {
  string submission_id = 1;
}

message ClaimGradingTaskResponse {
  bool success = 1;
  string message = 2;
  string locked_by_user_id = 3;
  string locked_by_name = 4;
  string lock_expires_at = 5;
  int32 lease_duration_seconds = 6;
}

message RenewGradingTaskLockRequest {
  string submission_id = 1;
  int32 extend_minutes = 2;
}

message RenewGradingTaskLockResponse {
  bool success = 1;
  string message = 2;
  string lock_expires_at = 3;
  int32 remaining_seconds = 4;
}

message ReleaseGradingTaskRequest {
  string submission_id = 1;
}

message ReleaseGradingTaskResponse {
  bool success = 1;
  string message = 2;
}

message PeerReviewHistoryItem {
  string review_id = 1;
  string reviewer_id = 2;
  string reviewer_name = 3;
  float total_score = 4;
  repeated RubricCriteria graded_criteria = 5;
  string feedback = 6;
  string reviewed_at = 7;
}

message StaffGradingDetail {
  string staff_id = 1;
  string staff_name = 2;
  float score = 3;
  repeated RubricCriteria graded_criteria = 4;
  string feedback = 5;
  bool is_draft = 6;
  string graded_at = 7;
  GradingProvenance provenance = 8;
  string appeal_resolution_notes = 9;
}

message GetGradingSubmissionDetailRequest {
  string submission_id = 1;
}

message GetGradingSubmissionDetailResponse {
  GradingQueueItem submission = 1;
  string submission_url = 2;
  string text_content = 3;
  int32 attempt_number = 4;
  repeated RubricCriteria rubric_criteria = 5;
  repeated PeerReviewHistoryItem peer_reviews = 6;
  StaffGradingDetail current_staff_grading = 7;
}

message SubmitStaffGradingRequest {
  string submission_id = 1;
  repeated RubricCriteria graded_criteria = 2;
  float total_score = 3;
  string feedback = 4;
  bool is_draft = 5;
  bool resolve_appeal = 6;
  string appeal_resolution_notes = 7;
  GradingProvenance provenance = 8;
}

message SubmitStaffGradingResponse {
  bool success = 1;
  string message = 2;
  float final_score = 3;
  bool is_draft = 4;
  string graded_at = 5;
}

message ReleaseCourseGradesRequest {
  string course_id = 1;
  string item_id = 2;
}

message ReleaseCourseGradesResponse {
  bool success = 1;
  string message = 2;
  int32 released_count = 3;
}
