syntax = "proto3";

package assessment.v1;

import "auth/v1/options.proto";

message SubmitHonorCodeRequest {
  string item_id = 1;
  bool is_agreed = 2;
}

message SubmitHonorCodeResponse {
  bool success = 1;
  string message = 2;
}

message SubmitGradedQuizRequest {
  string item_id = 1;
  repeated int32 selected_option_indexes = 2;
}

message QuizResult {
  float score_percent = 1;
  bool passed = 2;
  int32 attempts_left = 3;
  int32 cooldown_seconds_left = 4;
  repeated string answer_explanations = 5;
}

message SubmitGradedQuizResponse {
  QuizResult result = 1;
}

message SubmitAutoGradedLabRequest {
  string item_id = 1;
  string source_code = 2;
  string language = 3;
}

message AutoGradedLabResult {
  float score_percent = 1;
  bool passed = 2;
  int32 total_test_cases = 3;
  int32 passed_test_cases = 4;
  string test_logs = 5;
}

message SubmitAutoGradedLabResponse {
  AutoGradedLabResult result = 1;
}

message SubmitPeerAssignmentRequest {
  string item_id = 1;
  string submission_url = 2;
  string text_content = 3;
}

message SubmitPeerAssignmentResponse {
  string submission_id = 1;
  string status_message = 2;
}

message GetPeerReviewsToGradeRequest {
  string item_id = 1;
}

message RubricCriteria {
  string criteria_id = 1;
  string title = 2;
  float max_score = 3;
  float score_given = 4;
  string feedback = 5;
}

message PeerReviewItemToGrade {
  string review_id = 1;
  string submission_url = 2;
  string text_content = 3;
  repeated RubricCriteria rubric_criteria = 4;
}

message GetPeerReviewsToGradeResponse {
  repeated PeerReviewItemToGrade items_to_grade = 1;
}

message SubmitPeerReviewGradeRequest {
  string review_id = 1;
  repeated RubricCriteria graded_criteria = 2;
}

message SubmitPeerReviewGradeResponse {
  bool success = 1;
  string message = 2;
}

message SubmitGradeAppealRequest {
  string submission_id = 1;
  string appeal_reason = 2;
}

message SubmitGradeAppealResponse {
  bool success = 1;
  string appeal_status = 2;
}

message ReportPeerReviewRequest {
  string review_id = 1;
  string report_reason = 2;
}

message ReportPeerReviewResponse {
  bool success = 1;
  string message = 2;
}

message RegradePeerSubmissionByStaffRequest {
  string submission_id = 1;
  float ta_score = 2;
}

message RegradePeerSubmissionByStaffResponse {
  bool success = 1;
  string message = 2;
}

message QuestionOption {
  string id = 1;
  string question_id = 2;
  string option_text = 3;
  bool is_correct = 4;
  int32 order_index = 5;
}

message Question {
  string id = 1;
  string bank_id = 2;
  string question_type = 3; // 'SINGLE_CHOICE', 'MULTIPLE_CHOICE', 'TRUE_FALSE', 'FILL_IN_BLANK'
  string difficulty = 4;    // 'EASY', 'MEDIUM', 'HARD'
  string text = 5;
  string explanation = 6;
  repeated QuestionOption options = 7;
  string created_at = 8;
}

message QuestionBank {
  string id = 1;
  string course_id = 2;
  string title = 3;
  string category = 4; // 'PRACTICE', 'MODULE_EXAM', 'FINAL_EXAM'
  string description = 5;
  repeated Question questions = 6;
  string created_at = 7;
}

message QuizMatrix {
  string item_id = 1;
  string bank_id = 2;
  int32 time_limit_minutes = 3;
  float passing_threshold_percent = 4;
  int32 easy_count = 5;
  int32 medium_count = 6;
  int32 hard_count = 7;
  bool shuffle_options = 8;
}

message CreateQuestionBankRequest {
  string course_id = 1;
  string title = 2;
  string category = 3;
  string description = 4;
}

message CreateQuestionBankResponse {
  QuestionBank bank = 1;
}

message ListQuestionBanksRequest {
  string course_id = 1;
}

message ListQuestionBanksResponse {
  repeated QuestionBank banks = 1;
}

message AddQuestionToBankRequest {
  string bank_id = 1;
  string question_type = 2;
  string difficulty = 3;
  string text = 4;
  string explanation = 5;
  repeated QuestionOption options = 6;
}

message AddQuestionToBankResponse {
  Question question = 1;
}

message ConfigureQuizMatrixRequest {
  string item_id = 1;
  string bank_id = 2;
  int32 time_limit_minutes = 3;
  float passing_threshold_percent = 4;
  int32 easy_count = 5;
  int32 medium_count = 6;
  int32 hard_count = 7;
  bool shuffle_options = 8;
}

message ConfigureQuizMatrixResponse {
  QuizMatrix matrix = 1;
}

message GetQuizMatrixRequest {
  string item_id = 1;
}

message GetQuizMatrixResponse {
  QuizMatrix matrix = 1;
}

message UpdateQuestionRequest {
  string question_id = 1;
  string question_type = 2;
  string difficulty = 3;
  string text = 4;
  string explanation = 5;
  repeated QuestionOption options = 6;
}

message UpdateQuestionResponse {
  Question question = 1;
}

message DeleteQuestionRequest {
  string question_id = 1;
}

message DeleteQuestionResponse {
  bool success = 1;
  string message = 2;
}

service AssessmentService {
  rpc SubmitHonorCode(SubmitHonorCodeRequest) returns (SubmitHonorCodeResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitGradedQuiz(SubmitGradedQuizRequest) returns (SubmitGradedQuizResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitAutoGradedLab(SubmitAutoGradedLabRequest) returns (SubmitAutoGradedLabResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitPeerAssignment(SubmitPeerAssignmentRequest) returns (SubmitPeerAssignmentResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetPeerReviewsToGrade(GetPeerReviewsToGradeRequest) returns (GetPeerReviewsToGradeResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitPeerReviewGrade(SubmitPeerReviewGradeRequest) returns (SubmitPeerReviewGradeResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitGradeAppeal(SubmitGradeAppealRequest) returns (SubmitGradeAppealResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ReportPeerReview(ReportPeerReviewRequest) returns (ReportPeerReviewResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc RegradePeerSubmissionByStaff(RegradePeerSubmissionByStaffRequest) returns (RegradePeerSubmissionByStaffResponse) {
    option (auth.v1.policy) = AUTH_POLICY_ADMIN;
  }
  rpc CreateQuestionBank(CreateQuestionBankRequest) returns (CreateQuestionBankResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListQuestionBanks(ListQuestionBanksRequest) returns (ListQuestionBanksResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc AddQuestionToBank(AddQuestionToBankRequest) returns (AddQuestionToBankResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ConfigureQuizMatrix(ConfigureQuizMatrixRequest) returns (ConfigureQuizMatrixResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetQuizMatrix(GetQuizMatrixRequest) returns (GetQuizMatrixResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UpdateQuestion(UpdateQuestionRequest) returns (UpdateQuestionResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeleteQuestion(DeleteQuestionRequest) returns (DeleteQuestionResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
}
