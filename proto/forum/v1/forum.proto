syntax = "proto3";

package forum.v1;

import "auth/v1/options.proto";

message ForumReply {
  string id = 1;
  string thread_id = 2;
  string author_name = 3;
  string author_role = 4;
  string content = 5;
  bool is_staff_answer = 6;
  int32 upvote_count = 7;
  string created_at = 8;
  bool is_upvoted_by_me = 9;
  bool is_edited = 10;
  string edited_at = 11;
  string author_user_id = 12;
}

message ForumThread {
  string id = 1;
  string course_id = 2;
  string item_id = 3;
  string title = 4;
  string author_name = 5;
  string author_role = 6;
  string created_at = 7;
  int32 upvote_count = 8;
  bool is_staff_pinned = 9;
  repeated ForumReply replies = 10;
  bool is_upvoted_by_me = 11;
  bool is_edited = 12;
  string edited_at = 13;
  string author_user_id = 14;
  string content = 15;
}

message ListThreadsRequest {
  string course_id = 1;
  string item_id = 2;
  int32 skip = 3;
  int32 limit = 4;
}

message ListThreadsResponse {
  repeated ForumThread threads = 1;
  int32 total = 2;
}

message CreateThreadRequest {
  string course_id = 1;
  string item_id = 2;
  string title = 3;
  string content = 4;
}

message CreateThreadResponse {
  ForumThread thread = 1;
}

message PostReplyRequest {
  string thread_id = 1;
  string content = 2;
}

message PostReplyResponse {
  ForumReply reply = 1;
}

message VotePostRequest {
  string post_id = 1;
  bool is_upvote = 2;
}

message VotePostResponse {
  int32 updated_upvote_count = 1;
}

message PinStaffAnswerRequest {
  string reply_id = 1;
}

message PinStaffAnswerResponse {
  bool success = 1;
}

message UpdateThreadRequest {
  string thread_id = 1;
  string title = 2;
  string content = 3;
}

message UpdateThreadResponse {
  ForumThread thread = 1;
}

message DeleteThreadRequest {
  string thread_id = 1;
}

message DeleteThreadResponse {
  bool success = 1;
}

message UpdateReplyRequest {
  string reply_id = 1;
  string content = 2;
}

message UpdateReplyResponse {
  ForumReply reply = 1;
}

message DeleteReplyRequest {
  string reply_id = 1;
}

message DeleteReplyResponse {
  bool success = 1;
}

service ForumService {
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc PostReply(PostReplyRequest) returns (PostReplyResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc VotePost(VotePostRequest) returns (VotePostResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc PinStaffAnswer(PinStaffAnswerRequest) returns (PinStaffAnswerResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UpdateThread(UpdateThreadRequest) returns (UpdateThreadResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeleteThread(DeleteThreadRequest) returns (DeleteThreadResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UpdateReply(UpdateReplyRequest) returns (UpdateReplyResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc DeleteReply(DeleteReplyRequest) returns (DeleteReplyResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
}
