syntax = "proto3";

package certificate.v1;

import "auth/v1/options.proto";

message FinancialAidApplication {
  string id = 1;
  string user_id = 2;
  string course_id = 3;
  string essay_150_words = 4;
  string status = 5; // PENDING, APPROVED, REJECTED
  int32 review_deadline_days_left = 6;
}

message ApplyFinancialAidRequest {
  string course_id = 1;
  string essay_150_words = 2;
}

message ApplyFinancialAidResponse {
  FinancialAidApplication application = 1;
}

message GetFinancialAidStatusRequest {
  string course_id = 1;
}

message GetFinancialAidStatusResponse {
  FinancialAidApplication application = 1;
}

message ListFinancialAidApplicationsRequest {
  string course_id = 1;
  string status = 2; // PENDING, APPROVED, REJECTED
}

message ListFinancialAidApplicationsResponse {
  repeated FinancialAidApplication applications = 1;
}

message ReviewFinancialAidApplicationRequest {
  string application_id = 1;
  bool is_approved = 2;
  string admin_feedback = 3;
}

message ReviewFinancialAidApplicationResponse {
  FinancialAidApplication application = 1;
}

message VerifiedCertificate {
  string certificate_id = 1;
  string user_id = 2;
  string learner_name = 3;
  string course_title = 4;
  string partner_name = 5;
  string partner_logo_url = 6;
  string issue_date = 7;
  string verification_url = 8;
  string qr_code_url = 9;
  string open_badges_json_ld = 10;
  string signer_name = 11;
  string signer_title = 12;
  string signature_image_url = 13;
}

message GetVerifiedCertificateRequest {
  string course_id = 1;
}

message GetVerifiedCertificateResponse {
  VerifiedCertificate certificate = 1;
}

message VerifyCertificatePublicRequest {
  string certificate_id = 1;
}

message VerifyCertificatePublicResponse {
  bool is_valid = 1;
  VerifiedCertificate certificate = 2;
  string status_message = 3;
}

message RevokeCertificateRequest {
  string certificate_id = 1;
  string reason = 2;
}

message RevokeCertificateResponse {
  bool success = 1;
  string message = 2;
}

message IssueSpecializationCertificateRequest {
  string specialization_id = 1;
}

message IssueSpecializationCertificateResponse {
  VerifiedCertificate certificate = 1;
  string message = 2;
}

message ListMyCertificatesRequest {}

message ListMyCertificatesResponse {
  repeated VerifiedCertificate certificates = 1;
}

message ListMyFinancialAidsRequest {}

message ListMyFinancialAidsResponse {
  repeated FinancialAidApplication applications = 1;
}

service CertificateService {
  rpc ApplyFinancialAid(ApplyFinancialAidRequest) returns (ApplyFinancialAidResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetFinancialAidStatus(GetFinancialAidStatusRequest) returns (GetFinancialAidStatusResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListMyFinancialAids(ListMyFinancialAidsRequest) returns (ListMyFinancialAidsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListFinancialAidApplications(ListFinancialAidApplicationsRequest) returns (ListFinancialAidApplicationsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ReviewFinancialAidApplication(ReviewFinancialAidApplicationRequest) returns (ReviewFinancialAidApplicationResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetVerifiedCertificate(GetVerifiedCertificateRequest) returns (GetVerifiedCertificateResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc VerifyCertificatePublic(VerifyCertificatePublicRequest) returns (VerifyCertificatePublicResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc IssueSpecializationCertificate(IssueSpecializationCertificateRequest) returns (IssueSpecializationCertificateResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListMyCertificates(ListMyCertificatesRequest) returns (ListMyCertificatesResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetAdminCertificateStats(GetAdminCertificateStatsRequest) returns (GetAdminCertificateStatsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetAdminCertificateTrend(GetAdminCertificateTrendRequest) returns (GetAdminCertificateTrendResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListAdminCertificates(ListAdminCertificatesRequest) returns (ListAdminCertificatesResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
}

message GetAdminCertificateStatsRequest {}

message GetAdminCertificateStatsResponse {
  int32 certificates_issued = 1;
  int32 certificates_revoked = 2;
  int32 approved_financial_aids = 3;
  int32 pending_financial_aids = 4;
}

message GetAdminCertificateTrendRequest {
  // Number of trailing UTC days (including today) to chart; clamped server-side.
  int32 days = 1;
}

message AdminCertificateTrendPoint {
  // UTC calendar day formatted as YYYY-MM-DD.
  string date = 1;
  int32 issued = 2;
}

message GetAdminCertificateTrendResponse {
  repeated AdminCertificateTrendPoint points = 1;
}

enum AdminCertificateStatusFilter {
  ADMIN_CERTIFICATE_STATUS_FILTER_UNSPECIFIED = 0;
  ADMIN_CERTIFICATE_STATUS_FILTER_VALID = 1;
  ADMIN_CERTIFICATE_STATUS_FILTER_REVOKED = 2;
}

message AdminCertificateSummary {
  string certificate_id = 1;
  string learner_name = 2;
  string course_title = 3;
  string partner_name = 4;
  string issue_date = 5;
  bool is_revoked = 6;
  string revoked_reason = 7;
}

message ListAdminCertificatesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search_query = 3;
  AdminCertificateStatusFilter status = 4;
}

message ListAdminCertificatesResponse {
  repeated AdminCertificateSummary certificates = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}
