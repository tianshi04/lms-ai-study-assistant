syntax = "proto3";

package identity.v1;

import "auth/v1/options.proto";

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_LEARNER = 1;
  USER_ROLE_INSTRUCTOR = 2;
  USER_ROLE_ADMIN = 3;
}

message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  UserRole role = 4;
  string avatar_url = 6;
  string title = 7;
  bool is_identity_verified = 8;
  string signature_image_url = 9;
  string enterprise_seat_key = 10;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  User user = 2;
  string refresh_token = 3;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  UserRole role = 4;
}

message RegisterResponse {
  User user = 1;
}

message GetUserProfileRequest {
  string user_id = 1;
}

message GetUserProfileResponse {
  User user = 1;
}

message AssignEnterpriseSeatRequest {
  string user_id = 1;
  string enterprise_seat_key = 2;
}

message AssignEnterpriseSeatResponse {
  bool success = 1;
  string message = 2;
}

message EnterpriseSeat {
  string id = 1;
  string partner_name = 2;
  string seat_key = 3;
  string assigned_user_id = 4;
  string assigned_user_email = 5;
  string status = 6;
  string created_at = 7;
  string scope_type = 8;
  repeated string allowed_course_ids = 9;
}

message ListEnterpriseSeatsRequest {
  string partner_name = 1;
}

message ListEnterpriseSeatsResponse {
  repeated EnterpriseSeat seats = 1;
}

message CreateEnterpriseSeatRequest {
  string partner_name = 1;
  string seat_key = 2;
  string scope_type = 3;
  repeated string allowed_course_ids = 4;
}

message CreateEnterpriseSeatResponse {
  EnterpriseSeat seat = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message RevokeEnterpriseSeatRequest {
  string user_id = 1;
  string course_id = 2;
}

message RevokeEnterpriseSeatResponse {
  bool success = 1;
  string message = 2;
}

message UpdateInstructorProfileRequest {
  string title = 1;
  string signature_image_url = 2;
}

message UpdateInstructorProfileResponse {
  User user = 1;
}

message VerifyIdentityRequest {
  string user_id = 1;
  string id_card_number = 2;
}

message VerifyIdentityResponse {
  bool success = 1;
  string message = 2;
}

enum InstructorApplicationStatus {
  INSTRUCTOR_APPLICATION_STATUS_UNSPECIFIED = 0;
  INSTRUCTOR_APPLICATION_STATUS_PENDING_REVIEW = 1;
  INSTRUCTOR_APPLICATION_STATUS_APPROVED = 2;
  INSTRUCTOR_APPLICATION_STATUS_REJECTED = 3;
}

message InstructorApplication {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string bio = 4;
  string linkedin_url = 5;
  string cv_url = 6;
  string demo_video_url = 7;
  InstructorApplicationStatus status = 8;
  string rejection_reason = 9;
  string created_at = 10;
  string reviewed_at = 11;
}

message SubmitInstructorApplicationRequest {
  string title = 1;
  string bio = 2;
  string linkedin_url = 3;
  string cv_url = 4;
  string demo_video_url = 5;
}

message SubmitInstructorApplicationResponse {
  InstructorApplication application = 1;
}

message GetMyInstructorApplicationRequest {}

message GetMyInstructorApplicationResponse {
  InstructorApplication application = 1;
}

message ListInstructorApplicationsRequest {
  string status_filter = 1;
}

message ListInstructorApplicationsResponse {
  repeated InstructorApplication applications = 1;
}

message ReviewInstructorApplicationRequest {
  string application_id = 1;
  bool approve = 2;
  string rejection_reason = 3;
}

message ReviewInstructorApplicationResponse {
  InstructorApplication application = 1;
}

message OrganizationMemberDetail {
  string member_id = 1;
  string user_id = 2;
  string email = 3;
  string full_name = 4;
  string avatar_url = 5;
  string role_id = 6;
  string role_name = 7;
  string status = 8;
  string joined_at = 9;
}

message AddOrganizationMemberRequest {
  string email = 1;
  string role_id = 2;
  string organization_id = 3;
}

message AddOrganizationMemberResponse {
  OrganizationMemberDetail member = 1;
}

message ListOrganizationMembersRequest {
  string organization_id = 1;
}

message ListOrganizationMembersResponse {
  repeated OrganizationMemberDetail members = 1;
}

message RemoveOrganizationMemberRequest {
  string user_id = 1;
  string organization_id = 2;
}

message RemoveOrganizationMemberResponse {
  bool success = 1;
}

message GoogleRegisterVerifyRequest {
  string google_id_token = 1;
}

message GoogleRegisterVerifyResponse {
  string temp_token = 1;
  string email = 2;
  string full_name = 3;
  string avatar_url = 4;
  bool is_already_registered = 5;
}

message CompleteGoogleRegistrationRequest {
  string temp_token = 1;
  string password = 2;
  string full_name = 3;
  UserRole role = 4;
}

message CompleteGoogleRegistrationResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

message GoogleLoginRequest {
  string google_id_token = 1;
}

message GoogleLoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

message GoogleResetPasswordVerifyRequest {
  string google_id_token = 1;
}

message GoogleResetPasswordVerifyResponse {
  string temp_token = 1;
  string email = 2;
  string full_name = 3;
}

message CompleteResetPasswordRequest {
  string temp_token = 1;
  string new_password = 2;
}

message CompleteResetPasswordResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

service IdentityService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc GoogleRegisterVerify(GoogleRegisterVerifyRequest) returns (GoogleRegisterVerifyResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc CompleteGoogleRegistration(CompleteGoogleRegistrationRequest) returns (CompleteGoogleRegistrationResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc GoogleLogin(GoogleLoginRequest) returns (GoogleLoginResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc GoogleResetPasswordVerify(GoogleResetPasswordVerifyRequest) returns (GoogleResetPasswordVerifyResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc CompleteResetPassword(CompleteResetPasswordRequest) returns (CompleteResetPasswordResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc UpdateInstructorProfile(UpdateInstructorProfileRequest) returns (UpdateInstructorProfileResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc AssignEnterpriseSeat(AssignEnterpriseSeatRequest) returns (AssignEnterpriseSeatResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListEnterpriseSeats(ListEnterpriseSeatsRequest) returns (ListEnterpriseSeatsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc CreateEnterpriseSeat(CreateEnterpriseSeatRequest) returns (CreateEnterpriseSeatResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (auth.v1.policy) = AUTH_POLICY_PUBLIC;
  }
  rpc RevokeEnterpriseSeat(RevokeEnterpriseSeatRequest) returns (RevokeEnterpriseSeatResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc VerifyIdentity(VerifyIdentityRequest) returns (VerifyIdentityResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc SubmitInstructorApplication(SubmitInstructorApplicationRequest) returns (SubmitInstructorApplicationResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc GetMyInstructorApplication(GetMyInstructorApplicationRequest) returns (GetMyInstructorApplicationResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListInstructorApplications(ListInstructorApplicationsRequest) returns (ListInstructorApplicationsResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ReviewInstructorApplication(ReviewInstructorApplicationRequest) returns (ReviewInstructorApplicationResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc AddOrganizationMember(AddOrganizationMemberRequest) returns (AddOrganizationMemberResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc ListOrganizationMembers(ListOrganizationMembersRequest) returns (ListOrganizationMembersResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
  rpc RemoveOrganizationMember(RemoveOrganizationMemberRequest) returns (RemoveOrganizationMemberResponse) {
    option (auth.v1.policy) = AUTH_POLICY_AUTHENTICATED;
  }
}
